name: Adapter tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Mock adapter tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and mock integration tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Check CLI help
        env:
          PYTHONPATH: src:tests
        run: |
          python - <<'PY'
          import sys
          import test_support
          from farmctl.cli import main
          for command in ("integration", "integrate", "validate-adapters", "purge"):
              try:
                  main([command, "--help"])
              except SystemExit as exc:
                  if exc.code != 0:
                      raise
          PY
